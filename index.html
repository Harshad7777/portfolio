<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio</title>
<meta name="description" content="Personal portfolio" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="grain"></div>

<header class="topbar">
  <span class="topbar__mark">/portfolio</span>
  <nav class="topbar__nav">
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>

  <section class="hero" id="top">
    <p class="hero__eyebrow" data-fade></p>
    <h1 class="hero__name">
      <span id="heroName"></span>
      <svg class="hero__underline" viewBox="0 0 600 24" preserveAspectRatio="none" aria-hidden="true">
        <path d="M4 14 C 120 22, 240 4, 360 12 S 540 20, 596 10" />
      </svg>
    </h1>
    <p class="hero__thesis" id="heroThesis" data-fade></p>
    <p class="hero__now" id="heroNow" data-fade></p>
    <a class="hero__scroll" href="#work" aria-label="Scroll to work">
      <span></span>
    </a>
  </section>

  <section class="work" id="work">
    <div class="section__head" data-fade>
      <h2>Selected work</h2>
      <p class="section__count" id="workCount"></p>
    </div>
    <div class="work__grid" id="workGrid"></div>
  </section>

  <section class="about" id="about">
    <div class="about__bio" data-fade>
      <h2>About</h2>
      <div id="aboutText"></div>
    </div>
    <div class="about__skills" data-fade>
      <h3>Currently working with</h3>
      <ul id="skillsList" class="tag-list"></ul>
    </div>
  </section>

  <section class="contact" id="contact" data-fade>
    <h2 id="contactHeadline"></h2>
    <ul class="contact__links" id="contactLinks"></ul>
  </section>

</main>

<footer class="footer">
  <span id="footerName"></span>
  <span id="footerYear"></span>
</footer>

<script src="script.js"></script>
</body>
</html>
